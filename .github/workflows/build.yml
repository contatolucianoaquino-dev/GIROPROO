name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes do motor de cálculo
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar APK de debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: GiroPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Release com link direto para o APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GiroPro (versão de teste)
          body: |
            APK de teste do GiroPro. Baixe o `app-debug.apk` abaixo pelo navegador
            do celular e instale (permita "fontes desconhecidas").
          files: app/build/outputs/apk/debug/app-debug.apk
